# Public-repository regression checks run on disposable GitHub-hosted infrastructure.
# Never attach self-hosted personal-machine runners to public pull_request events.
name: AI Development Studio tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/check-ui.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/check-ui.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-studio-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 regression suite (GitHub-hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout without retained repository credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Full regression suite, UI contract and server syntax
        run: npm test
